version: "3.8"

services:
  # Qdrant Vector Store (Hybrid Search)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: alphascribe_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # FastAPI Backend (Python + R + LangGraph)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alphascribe_backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AlphaScribe AI
      - DATABASE_URL=sqlite:///./data/app.db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

  # Next.js 14 Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alphascribe_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
